<div class="tetris-app-container">
    <!-- 상단 와이드 헤더 (예시 디자인 반영) -->
    <div class="tetris-top-banner">
        <div class="banner-left">
            <div class="banner-icon-box">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div class="banner-info">
                <div class="banner-title-row">
                    <h2 class="banner-title">테트리스</h2>
                    <span class="banner-version">v1.0.0</span>
                    <span id="tetris-status-badge" class="tetris-badge">READY</span>
                </div>
                <p class="banner-desc">클래식 아케이드 블록 퍼즐 게임 · 키보드 및 터치 조작 지원</p>
            </div>
        </div>

        <div class="banner-actions">
            <button id="btn-start" class="btn-banner primary"><i class="fa-solid fa-play"></i> 게임 시작</button>
            <button id="btn-pause" class="btn-banner secondary" disabled><i class="fa-solid fa-pause"></i> 일시 정지</button>
            <button id="btn-reset" class="btn-banner danger"><i class="fa-solid fa-rotate-left"></i> 초기화</button>
        </div>
    </div>

    <!-- 메인 와이드 게임 스테이지 (3단 구성) -->
    <div class="tetris-stage-grid">
        <!-- 좌측 패널: 실시간 통계 정보 -->
        <div class="stage-col left-col">
            <div class="tetris-panel-card">
                <div class="panel-header">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span>STATISTICS</span>
                </div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <span class="stat-lbl">SCORE</span>
                        <span id="tetris-score" class="stat-val highlight">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">HIGH SCORE</span>
                        <span id="tetris-high-score" class="stat-val">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">LEVEL</span>
                        <span id="tetris-level" class="stat-val">1</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">LINES</span>
                        <span id="tetris-lines" class="stat-val">0</span>
                    </div>
                </div>
            </div>

            <div class="tetris-panel-card help-panel">
                <div class="panel-header">
                    <i class="fa-regular fa-keyboard"></i>
                    <span>조작 가이드</span>
                </div>
                <ul class="key-guide-list">
                    <li><span>좌 / 우 이동</span> <div class="key-group"><kbd>←</kbd> <kbd>→</kbd></div></li>
                    <li><span>블록 회전</span> <kbd>↑</kbd></li>
                    <li><span>소프트 드롭</span> <kbd>↓</kbd></li>
                    <li><span>하드 드롭 (즉시 낙하)</span> <kbd>Space</kbd></li>
                    <li><span>일시 정지</span> <kbd>P</kbd></li>
                </ul>
            </div>
        </div>

        <!-- 중앙 패널: 대형 테트리스 메인 보드 -->
        <div class="stage-col center-col">
            <div class="tetris-board-frame">
                <canvas id="tetris-board" width="360" height="720"></canvas>

                <!-- 게임 오버 / 일시정지 오버레이 -->
                <div id="tetris-overlay" class="tetris-overlay hidden">
                    <h2 id="overlay-title">GAME OVER</h2>
                    <p id="overlay-msg">다시 도전해보세요!</p>
                    <button id="btn-overlay-action" class="btn-banner primary">다시 시작</button>
                </div>
            </div>
        </div>

        <!-- 우측 패널: NEXT 블록 및 모바일 컨트롤러 -->
        <div class="stage-col right-col">
            <div class="tetris-panel-card next-panel">
                <div class="panel-header">
                    <i class="fa-solid fa-forward"></i>
                    <span>NEXT BLOCK</span>
                </div>
                <div class="next-canvas-wrapper">
                    <canvas id="tetris-next" width="140" height="140"></canvas>
                </div>
            </div>

            <!-- 터치/온스크린 컨트롤러 (화면이 좁아지거나 터치 기기용) -->
            <div class="tetris-touch-controls">
                <div class="touch-row">
                    <button class="touch-btn" data-action="rotate"><i class="fa-solid fa-rotate-right"></i> 회전</button>
                </div>
                <div class="touch-row middle">
                    <button class="touch-btn" data-action="left"><i class="fa-solid fa-arrow-left"></i></button>
                    <button class="touch-btn" data-action="down"><i class="fa-solid fa-arrow-down"></i></button>
                    <button class="touch-btn" data-action="right"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <div class="touch-row">
                    <button class="touch-btn hard-drop" data-action="drop"><i class="fa-solid fa-angles-down"></i> HARD DROP</button>
                </div>
            </div>
        </div>
    </div>
</div>
