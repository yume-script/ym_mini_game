<!-- 테트리스 & 지뢰찾기 개별 스타일 로드 -->
<link rel="stylesheet" href="/plugins/metadata/ym_mini_game/games/tetris/style.css">
<link rel="stylesheet" href="/plugins/metadata/ym_mini_game/games/minesweeper/style.css">

<div class="mini-app-container">
    <!-- 상단 와이드 헤더 배너 -->
    <div class="mini-top-banner">
        <div class="banner-left">
            <div class="banner-icon-box">
                <i id="banner-main-icon" class="fa-solid fa-gamepad"></i>
            </div>
            <div class="banner-info">
                <div class="banner-title-row">
                    <h2 class="banner-title">미니게임 아케이드</h2>
                    <span class="banner-version">v1.0.0</span>
                    <span id="app-status-badge" class="mini-badge">READY</span>
                </div>
                <p class="banner-desc">북오아시스 미니게임 허브 · 드롭다운으로 게임을 선택하세요.</p>
            </div>
        </div>

        <div class="banner-actions">
            <!-- 🎮 게임 선택 드롭다운 (등록된 게임들이 자동 감지됨) -->
            <div class="game-select-wrapper">
                <i class="fa-solid fa-gamepad select-icon"></i>
                <select id="game-selector" class="game-dropdown"></select>
            </div>
        </div>
    </div>

    <!-- 🕹️ 동적 게임 마운트 뷰포트 -->
    <div id="game-viewport" class="game-viewport"></div>
</div>

<!-- 테트리스 & 지뢰찾기 개별 독립 엔진 로드 -->
<script src="/plugins/metadata/ym_mini_game/games/tetris/game.js"></script>
<script src="/plugins/metadata/ym_mini_game/games/minesweeper/game.js"></script>
