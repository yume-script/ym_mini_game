<div class="tetris-container">
    <div class="tetris-wrapper">
        <!-- 메인 게임 보드 영역 -->
        <div class="tetris-main-card">
            <div class="tetris-header">
                <h3 class="tetris-title"><i class="fa-solid fa-gamepad"></i> BOOKOASIS TETRIS</h3>
                <span id="tetris-status-badge" class="tetris-badge">READY</span>
            </div>
            
            <div class="tetris-canvas-wrapper">
                <canvas id="tetris-board" width="300" height="600"></canvas>
                
                <!-- 게임 오버 / 일시정지 오버레이 -->
                <div id="tetris-overlay" class="tetris-overlay hidden">
                    <h2 id="overlay-title">GAME OVER</h2>
                    <p id="overlay-msg">다시 도전해보세요!</p>
                    <button id="btn-overlay-action" class="tetris-btn primary">다시 시작 (Restart)</button>
                </div>
            </div>
        </div>

        <!-- 사이드 패널 (점수판, 다음 블록, 컨트롤 버튼) -->
        <div class="tetris-sidebar">
            <!-- 다음 블록 카드 -->
            <div class="tetris-card next-card">
                <h4>NEXT</h4>
                <div class="next-canvas-wrapper">
                    <canvas id="tetris-next" width="120" height="120"></canvas>
                </div>
            </div>

            <!-- 스코어 보드 카드 -->
            <div class="tetris-card stat-card">
                <div class="stat-item">
                    <span class="stat-label">SCORE</span>
                    <span id="tetris-score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">LEVEL</span>
                    <span id="tetris-level" class="stat-value">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">LINES</span>
                    <span id="tetris-lines" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">HIGH SCORE</span>
                    <span id="tetris-high-score" class="stat-value">0</span>
                </div>
            </div>

            <!-- 게임 조작 버튼 카드 -->
            <div class="tetris-card action-card">
                <button id="btn-start" class="tetris-btn primary">게임 시작</button>
                <button id="btn-pause" class="tetris-btn secondary" disabled>일시 정지</button>
                <button id="btn-reset" class="tetris-btn danger">초기화</button>
            </div>

            <!-- 조작법 안내 -->
            <div class="tetris-card help-card">
                <h4><i class="fa-regular fa-keyboard"></i> 조작법</h4>
                <ul>
                    <li><kbd>←</kbd> <kbd>→</kbd> : 좌/우 이동</li>
                    <li><kbd>↑</kbd> : 시계방향 회전</li>
                    <li><kbd>↓</kbd> : 소프트 드롭</li>
                    <li><kbd>Space</kbd> : 하드 드롭 (즉시 낙하)</li>
                    <li><kbd>P</kbd> : 일시 정지</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 모바일 / 터치 스크린 전용 컨트롤러 -->
    <div class="tetris-touch-controls">
        <div class="touch-row">
            <button class="touch-btn" data-action="rotate"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div class="touch-row middle">
            <button class="touch-btn" data-action="left"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="touch-btn" data-action="down"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="touch-btn" data-action="right"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="touch-row">
            <button class="touch-btn hard-drop" data-action="drop"><i class="fa-solid fa-angles-down"></i> HARD DROP</button>
        </div>
    </div>
</div>
